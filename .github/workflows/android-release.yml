name: Build Signed Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "APK 启动时加载的网页地址"
        required: false
        default: "https://sun1123.netlify.app/"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        working-directory: android
        env:
          SHELL_KEYSTORE_BASE64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
          SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD }}
          SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS }}
          SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -PappUrl="${{ inputs.app_url || 'https://sun1123.netlify.app/' }}"

      - name: Verify APK signature
        run: |
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          "${BUILD_TOOLS}/apksigner" verify --print-certs \
            android/app/build/outputs/apk/release/*.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: sun1123-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            android/app/build/outputs/apk/release/*.apk \
            --title "Android ${GITHUB_REF_NAME}" \
            --generate-notes
