name: Validate chat message chain

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "lib/chat-engine.ts"
      - "lib/turn-coordinator.ts"
      - "lib/short-term-assembler.ts"
      - "lib/push-bailout-client.ts"
      - "lib/push-outbox-client.ts"
      - "lib/follow-up-service.ts"
      - "lib/llm-prompt-assembler.ts"
      - "components/chat/chat-room.tsx"
      - "components/life/life-engine-app.tsx"
      - "supabase/functions/push-generate/**"
      - ".github/workflows/chat-message-chain-validation.yml"
  push:
    branches: [main]
    paths:
      - "lib/chat-engine.ts"
      - "lib/turn-coordinator.ts"
      - "lib/short-term-assembler.ts"
      - "lib/push-bailout-client.ts"
      - "lib/push-outbox-client.ts"
      - "lib/follow-up-service.ts"
      - "lib/llm-prompt-assembler.ts"
      - "components/chat/chat-room.tsx"
      - "components/life/life-engine-app.tsx"
      - "supabase/functions/push-generate/**"
      - ".github/workflows/chat-message-chain-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-message-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Life regression tests
        run: npm run test:life
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run build
