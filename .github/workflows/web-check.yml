name: Web Typecheck

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "scripts/**"
      - "supabase/**"
      - "docs/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.mjs"
      - ".github/workflows/web-check.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check generated push package
        run: npm run check:push

      - name: Check WeChat assistant package
        run: npm run check:weixin

      - name: Check custom app SDK consistency
        run: npm run check:sdk

      - name: TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Production build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
