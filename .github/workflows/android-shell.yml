name: Build Android Shell APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "要加载的自部署站点地址（https://…）"
        required: false
        type: string
  push:
    branches: [main, feature/life-system, feature/life-system-mainline]
    paths: ["android-shell/**", ".github/workflows/android-shell.yml", "scripts/check-android-permissions.mjs", "!android-shell/**/*.md"]
  pull_request:
    branches: [main]
    paths: ["android-shell/**", ".github/workflows/android-shell.yml", "scripts/check-android-permissions.mjs", "!android-shell/**/*.md"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 可选签名：仓库 Secrets 配置了 SHELL_KEYSTORE_BASE64 等四项时产出已签名 release
    env:
      SHELL_KEYSTORE_BASE64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
      SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD }}
      SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS }}
      SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD }}
      SHELL_SITE_URL: ${{ inputs.site_url || vars.SHELL_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Android manifest permission baseline and version parity
        run: node scripts/check-android-permissions.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle 版本必须与根 build.gradle 里的 AGP 匹配：AGP 8.9 要求
      # Gradle 8.11.1 及以上。这两处是一对，改一处不改另一处必然失败。
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore (optional)
        if: ${{ env.SHELL_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$SHELL_KEYSTORE_BASE64" | base64 -d > /tmp/shell.keystore
          echo "SHELL_KEYSTORE_FILE=/tmp/shell.keystore" >> "$GITHUB_ENV"

      - name: Validate optional release signing secrets
        shell: bash
        run: |
          if [[ -n "$SHELL_KEYSTORE_BASE64" ]]; then
            for key in SHELL_KEYSTORE_PASSWORD SHELL_KEY_ALIAS SHELL_KEY_PASSWORD; do
              if [[ -z "${!key}" ]]; then
                echo "::error::$key is required when SHELL_KEYSTORE_BASE64 is configured."
                exit 1
              fi
            done
          else
            echo "No release keystore configured. Only the installable debug APK will be published; unsigned release APKs are intentionally skipped."
          fi

      - name: Build debug APK
        run: gradle -p android-shell assembleDebug

      - name: Build signed release APK
        if: ${{ env.SHELL_KEYSTORE_FILE != '' }}
        run: gradle -p android-shell assembleRelease

      - name: Verify debug APK signature
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose android-shell/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify signed release APK signature
        if: ${{ env.SHELL_KEYSTORE_FILE != '' }}
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose android-shell/app/build/outputs/apk/release/*.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-debug
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: ${{ env.SHELL_KEYSTORE_FILE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-release-signed
          path: android-shell/app/build/outputs/apk/release/*.apk
