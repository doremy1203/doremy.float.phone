name: Temporary npm Security Repair

on:
  push:
    branches: [main]
    paths:
      - ".github/npm-security-fix.trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Apply non-breaking security updates
        run: npm audit fix

      - name: Reinstall updated lockfile
        run: npm ci

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Check generated push package
        run: npm run check:push

      - name: Check WeChat assistant package
        run: npm run check:weixin

      - name: Check custom app SDK consistency
        run: npm run check:sdk

      - name: TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Production build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Commit verified dependency updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: fix vulnerable npm dependencies"
          git push origin HEAD:main
