name: Validate diary search and reading

on:
  pull_request:
    branches: [main]
    paths:
      - "components/diary/diary-entries-app.tsx"
      - "styles/diary.css"
      - "lib/diary-entry-export.ts"
      - ".github/workflows/diary-validation.yml"

permissions:
  contents: read

concurrency:
  group: diary-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint diary implementation
        run: npm run lint
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run build
