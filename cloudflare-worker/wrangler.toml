name = "ai-phone-push"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 数据库绑定（部署时自动创建）
[[d1_databases]]
binding = "DB"
database_name = "ai-phone-push"
database_id = "YOUR_D1_DATABASE_ID"  # 部署后由 Cloudflare 分配

# 环境变量（部署后通过 Cloudflare Dashboard 或 wrangler secret 设置）
# WXPUSHER_SPT = "SPT_xxx"  # WxPusher 推送密钥
# SITE_ORIGIN = "https://your-site.com"  # 站点地址（可选）

# Cron 触发器：每分钟检查定时消息
[triggers]
crons = ["* * * * *"]

# 本地开发配置
[dev]
port = 8787
local_protocol = "http"
